name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # REQUIRED, do not remove. actions/checkout defaults to fetch-depth: 1,
          # which leaves a shallow clone with a single commit. Every
          # `git rev-list --count HEAD -- <file>` then returns 1 and every
          # `git log -1 --format=%cs` returns the CI checkout's own commit, so
          # build-time revision codegen would stamp `Rev 1` on every document in
          # the only environment that actually runs the build. Full history is
          # the entire point of computing a revision from git.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-to-costliest so a formatting slip fails in seconds.
      - name: Lint (prettier --check)
        run: npm run lint

      - name: Type/template check (astro check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
