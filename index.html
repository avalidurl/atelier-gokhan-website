<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier Gökhan — agent accelerator studio</title>
<meta name="description" content="Atelier Gökhan — an agent accelerator studio. Coming soon." />
<meta property="og:title" content="Atelier Gökhan" />
<meta property="og:description" content="An agent accelerator studio. Coming soon." />
<meta property="og:image" content="/assets/banner.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root { --bg:#0a0a0b; --fg:#f4f1ea; --muted:#8a857c; --line:#1c1c1f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    display:flex; flex-direction:column; min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6vh 24px; gap:34px; text-align:center; }
  .banner {
    width:min(680px, 90vw); aspect-ratio:1/1; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.55);
    background:#111 url('/assets/banner.png') center/cover no-repeat;
  }
  .word { font-size:clamp(34px,7vw,68px); letter-spacing:.01em; font-weight:600; }
  .word .dot { color:#c9a227; }
  .tag { font-size:clamp(15px,2.4vw,20px); color:var(--muted); font-style:italic; letter-spacing:.02em; }
  .soon { font-size:13px; text-transform:uppercase; letter-spacing:.32em; color:var(--muted); }
  .x { display:inline-flex; align-items:center; gap:9px; color:var(--fg); text-decoration:none; font-family:ui-sans-serif,system-ui,sans-serif; font-size:14px; padding:11px 18px; border:1px solid var(--line); border-radius:999px; transition:border-color .2s, transform .2s; }
  .x:hover { border-color:#3a3a3f; transform:translateY(-1px); }
  .x svg { width:16px; height:16px; fill:currentColor; }
  footer { padding:22px; text-align:center; color:#55514a; font-family:ui-sans-serif,system-ui,sans-serif; font-size:12px; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="banner" role="img" aria-label="Atelier Gökhan"></div>
    <div>
      <h1 class="word">Atelier&nbsp;Gökhan<span class="dot">.</span></h1>
      <p class="tag">An agent accelerator studio.</p>
    </div>
    <p class="soon">Coming&nbsp;soon</p>
    <!-- TODO: confirm the X handle below -->
    <a class="x" href="https://x.com/gokhanturhan" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      @gokhanturhan
    </a>
  </main>
  <footer>© Atelier Gökhan · gokhan.vc</footer>
</body>
</html>
