<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="boil" cx="50%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#8466C4" />
      <stop offset="55%" stop-color="#E06699" />
      <stop offset="100%" stop-color="#1F9E6B" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#8466C4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8466C4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- page -->
  <rect x="0" y="0" width="1200" height="630" fill="#e7e7e7" />

  <!-- hard offset shadow + framed sheet (neo-brutalist) -->
  <rect x="72" y="72" width="1056" height="486" fill="#141414" />
  <rect x="62" y="62" width="1056" height="486" fill="#ffffff" stroke="#141414" stroke-width="4" />

  <!-- boiling-pot mark, top-right inside the sheet -->
  <g transform="translate(986,104)">
    <rect x="-4" y="-4" width="96" height="96" fill="#141414" />
    <rect x="0" y="0" width="88" height="88" fill="url(#boil)" />
    <rect x="0" y="0" width="88" height="88" fill="url(#core)" />
    <rect x="0" y="0" width="88" height="88" fill="none" stroke="#141414" stroke-width="3" stroke-opacity="0.55" />
  </g>

  <!-- stamp -->
  <text x="112" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="22" letter-spacing="6" fill="#7c7c7c">GOKHAN.VC · VENTURE STUDIO</text>

  <!-- wordmark -->
  <text x="110" y="250" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="76" letter-spacing="-1" fill="#141414">Atelier Gökhan Turhan</text>

  <!-- accentuated blurb (purple/rose/green key phrases, mirrors the hero) -->
  <text x="112" y="338" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="600"
        font-size="40" fill="#141414">a <tspan fill="#E06699">mechanomical</tspan> research into the</text>
  <text x="112" y="392" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="600"
        font-size="40" fill="#141414">techniques of <tspan fill="#1F9E6B">AGI + human conviviality</tspan></text>
  <text x="112" y="446" font-family="Archivo, Arial, Helvetica, sans-serif" font-weight="600"
        font-size="40" fill="#141414">in the long now.</text>

  <!-- accent swatches + domain -->
  <g transform="translate(112,500)">
    <rect x="0" y="0" width="26" height="26" fill="#8466C4" stroke="#141414" stroke-width="2" />
    <rect x="34" y="0" width="26" height="26" fill="#E06699" stroke="#141414" stroke-width="2" />
    <rect x="68" y="0" width="26" height="26" fill="#1F9E6B" stroke="#141414" stroke-width="2" />
  </g>
  <text x="998" y="520" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="26" font-weight="700" fill="#8466C4">gokhan.vc</text>
</svg>
